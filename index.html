<!DOCTYPE HTML>
<html>
<head>
    <title>Mouseia</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="images/favicon-dancer.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,600">
    <link rel="stylesheet" href="shared/css/history-nav.css?v=20261024-2">
    <style>
        /* Core Styles from main.css */
        html, body, div, span, h1, p, a, figure, figcaption, header, footer { margin: 0; padding: 0; border: 0; font-size: 100%; font: inherit; vertical-align: baseline; }
        body { line-height: 1; -webkit-text-size-adjust: none; }

        /* Dark is the default; light follows the device's appearance setting. */
        :root {
            color-scheme: dark;
            --bg: #1f1b18;
            --bg-shade: rgba(0, 0, 0, 0.5);
            --ink: #ffffff;
            --ink-rgb: 255, 255, 255;
            --accent: #dbb7a7;
            --cover-glow: 0 0 25px rgba(255, 255, 255, 0.2);
            /* The galleries' menu panel, for Back and Forward's menus. */
            --panel-rgb: 25, 25, 25;
        }

        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #f3efe9;
                --bg-shade: rgba(255, 255, 255, 0.3);
                --ink: #1f1b18;
                --ink-rgb: 31, 27, 24;
                --accent: #9c6247;
                --cover-glow: 0 0 25px rgba(60, 50, 40, 0.18);
                --panel-rgb: 250, 249, 247;
            }
        }

        html { box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: "Source Sans Pro", sans-serif;
            font-weight: 300;
            font-size: 16pt;
            line-height: 1.65;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            cursor: pointer;
        }

        /* Background Styling */
        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        #bg:before {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to top, var(--bg-shade), var(--bg-shade));
            background-size: auto;
            background-position: center;
            z-index: 2;
        }
         #bg:after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scale(1.125);
            background-color: var(--bg);
            z-index: 1;
        }


        /* Layout and Content Styling */
        #wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 100vh;
            width: 100%;
            z-index: 3;
            padding: 2rem;
            text-align: center;
        }
        
        #project-links {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 7rem; /* This now accurately controls the spacing */
        }

        .project-item figure {
            /* MODIFIED: width is no longer fixed, it will shrink to fit the image */
            cursor: default;
            margin: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .project-item img {
            display: block;
            height: auto;
            max-height: 340px; /* This is now the main control for image size */
            border: 1px solid rgba(var(--ink-rgb), 0.25);
            transition: all 0.3s ease;
        }

        .project-item figcaption {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 300;
            transition: color 0.3s ease;
            line-height: 1.4;
        }
        
        .image-count {
            display: block;
            font-size: 0.65rem;
            opacity: 0.7;
            margin-top: 0.3em;
        }
        
        .project-item a:hover img {
            transform: scale(1.05);
            border-color: var(--ink);
            box-shadow: var(--cover-glow);
        }
        
        .project-item a:hover + figcaption {
            color: var(--accent);
        }


        @media screen and (max-width: 736px) {
            #project-links {
                flex-direction: column;
                gap: 3rem;
            }
            .project-item img {
                max-height: 260px; /* Control size for smaller screens */
            }
        }

    </style>
</head>
<body>
    <nav id="history-nav" class="history-nav" aria-label="Back and Forward">
        <button id="history-back" class="history-nav-button" type="button" aria-label="Back" disabled>
            <svg viewBox="0 0 13 18" aria-hidden="true" focusable="false">
                <path d="M1 9.424C1 9.181 1.092 8.979 1.281 8.79L7.715 2.582C7.869 2.422 8.067 2.346 8.294 2.346C8.752 2.346 9.112 2.702 9.112 3.16C9.112 3.39 9.023 3.59 8.865 3.752L2.975 9.425L8.865 15.095C9.024 15.257 9.112 15.463 9.112 15.686C9.112 16.144 8.752 16.5 8.294 16.5C8.066 16.5 7.869 16.424 7.715 16.264L1.281 10.057C1.093 9.868 1.001 9.667 1 9.424Z"></path>
            </svg>
        </button>
        <button id="history-forward" class="history-nav-button" type="button" aria-label="Forward" disabled>
            <svg viewBox="0 0 13 18" aria-hidden="true" focusable="false">
                <path d="M11.112 9.424C11.111 9.667 11.025 9.868 10.831 10.057L4.401 16.264C4.247 16.424 4.053 16.5 3.824 16.5C3.366 16.5 3 16.144 3 15.686C3 15.463 3.098 15.257 3.248 15.095L9.146 9.425L3.248 3.752C3.099 3.59 3 3.39 3 3.16C3 2.702 3.366 2.346 3.824 2.346C4.051 2.346 4.247 2.422 4.401 2.582L10.831 8.79C11.027 8.979 11.112 9.181 11.112 9.424Z"></path>
            </svg>
        </button>
    </nav>

    <div id="wrapper">
        <div id="project-links">

            <div class="project-item">
                <figure>
                    <a href="/game-of-thrones">
                        <img src="images/jon-snow-promo.webp" alt="Game of Thrones">
                    </a>
                    <figcaption>
                        Game of Thrones
                        <span class="image-count" id="got-count">-- Items</span>
                    </figcaption>
                </figure>
            </div>

            <div class="project-item">
                <figure>
                    <a href="/house-of-the-dragon">
                        <img src="images/rhaenyra-promo.webp" alt="House of the Dragon">
                    </a>
                    <figcaption>
                        House of the Dragon
                        <span class="image-count" id="hotd-count">-- Items</span>
                    </figcaption>
                </figure>
            </div>

            <div class="project-item">
                <figure>
                    <a href="/the-witcher">
                        <img src="images/witcher-promo.webp" alt="The Witcher">
                    </a>
                    <figcaption>
                        The Witcher
                        <span class="image-count" id="witcher-count">-- Items</span>
                    </figcaption>
                </figure>
            </div>
            
        </div>
    </div>
    
    <div id="bg"></div>

    <script src="shared/js/history-nav.js?v=20261024-1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setUpSiteHistoryNav();

            const projects = [
                { id: 'got-count', path: 'game-of-thrones/gallery-data.json' },
                { id: 'hotd-count', path: 'house-of-the-dragon/gallery-data.json' },
                { id: 'witcher-count', path: 'the-witcher/gallery-data.json' }
            ];

            projects.forEach(project => {
                fetch(project.path)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        const element = document.getElementById(project.id);
                        if (element) {
                            element.textContent = `${data.length} Items`;
                        }
                    })
                    .catch(error => {
                        console.error(`Could not load image count for ${project.path}:`, error);
                        const element = document.getElementById(project.id);
                        if (element) {
                            element.textContent = 'Count Unavailable';
                        }
                    });
            });
        });
    </script>

</body>
</html>
