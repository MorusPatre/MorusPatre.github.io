<!DOCTYPE HTML>
<html>
    <head>
        <title>The Witcher</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <meta name="color-scheme" content="dark light" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

        <link rel="stylesheet" href="../shared/css/gallery.css?v=20261023-10" />
        <noscript><link rel="stylesheet" href="../shared/css/noscript.css" /></noscript>
        <style>
            :root {
                --theme-bg: #1f1b18;
                --theme-bg-rgb: 31, 27, 24;
                --theme-bg-overlay: linear-gradient(to top, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("/shared/images/overlay.png");
            }

            @media (prefers-color-scheme: light) {
                :root {
                    --theme-bg: #f3efe9;
                    --theme-bg-rgb: 243, 239, 233;
                    --theme-bg-overlay: linear-gradient(to top, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), url("/shared/images/overlay.png");
                }
            }
        </style>
    </head>
    <body>
        <div id="loader-wrapper">
            <div class="loader"></div>
        </div>

        <div id="app-shell">
            <button id="sidebar-toggle"
                    class="sidebar-toggle"
                    type="button"
                    aria-label="Close sidebar"
                    aria-controls="finder-sidebar"
                    aria-expanded="true">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <rect x="3.5" y="5" width="17" height="14" rx="3"></rect>
                    <path d="M9 5v14"></path>
                </svg>
            </button>

            <aside id="finder-sidebar" aria-label="Sidebar">
                <div class="sidebar-content">
                    <section class="sidebar-filter-section sidebar-filter-section--placeholder" aria-label="Category">
                        <h2 class="sidebar-filter-heading">Category:</h2>
                        <div class="sidebar-option-list">
                            <button class="sidebar-option sidebar-option--emphasis is-active" type="button" aria-disabled="true">All categories</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Publicity still</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Promo</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Behind-the-scenes</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Pre-production</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Official screen capture</button>
                        </div>
                    </section>

                    <section class="sidebar-filter-section" aria-label="Season">
                        <h2 class="sidebar-filter-heading">Season:</h2>
                        <div id="sidebar-season-options" class="sidebar-option-list sidebar-option-list--inline" role="group" aria-label="Season filter">
                            <button class="sidebar-option sidebar-option--emphasis is-active" type="button" data-sidebar-filter="season" data-sidebar-value="all" aria-pressed="true">All</button>
                        </div>
                    </section>

                    <section class="sidebar-filter-section" aria-label="Episode">
                        <h2 class="sidebar-filter-heading">Episode:</h2>
                        <div id="sidebar-episode-options" class="sidebar-option-list sidebar-option-list--inline" role="group" aria-label="Episode filter">
                            <button class="sidebar-option sidebar-option--emphasis is-active" type="button" data-sidebar-filter="episode" data-sidebar-value="all" aria-pressed="true">All</button>
                        </div>
                    </section>

                    <section class="sidebar-filter-section" aria-label="Cast and crew">
                        <h2 class="sidebar-filter-heading">Cast &amp; Crew:</h2>
                        <div class="sidebar-option-list" role="group" aria-label="Cast and crew filter">
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Henry Cavill" aria-pressed="false">Henry Cavill</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Freya Allan" aria-pressed="false">Freya Allan</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Anya Chalotra" aria-pressed="false">Anya Chalotra</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="MyAnna Buring" aria-pressed="false">MyAnna Buring</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Joey Batey" aria-pressed="false">Joey Batey</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Kim Bodnia" aria-pressed="false">Kim Bodnia</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Eamon Farren" aria-pressed="false">Eamon Farren</button>
                            <button class="sidebar-option" type="button" data-sidebar-filter="person" data-sidebar-value="Paul Bullion" aria-pressed="false">Paul Bullion</button>
                            <button class="sidebar-option sidebar-option--emphasis" type="button" data-sidebar-node="all-people" aria-pressed="false">All People…</button>
                        </div>
                    </section>

                    <section class="sidebar-filter-section" aria-label="Group by">
                        <h2 class="sidebar-filter-heading">Group by:</h2>
                        <div id="sidebar-group-by-options" class="sidebar-option-list" role="group" aria-label="Group by"></div>
                    </section>

                    <section class="sidebar-filter-section sidebar-filter-section--placeholder" aria-label="Sort by">
                        <h2 class="sidebar-filter-heading">Sort by:</h2>
                        <div class="sidebar-option-list">
                            <button class="sidebar-option is-active" type="button" aria-disabled="true">Popularity</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Date</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Set</button>
                            <button class="sidebar-option" type="button" aria-disabled="true">Episode</button>
                        </div>
                    </section>
                </div>

                <div class="sidebar-resize-handle"
                     role="separator"
                     aria-label="Resize sidebar"
                     aria-orientation="vertical"
                     tabindex="0"></div>
            </aside>

            <div id="wrapper">
                <header id="header">
                    <div class="logo">
                        <img src="images/witcher_wolf.png" alt="Witcher Wolf Medallion" draggable="false" />
                    </div>
                    <div id="search-container">
                        <form onsubmit="return false;">
                            <span class="search-icon"></span>
                            <div id="search-wrapper" class="search-wrapper">
                                 <input type="text" id="search-input" placeholder="Search by filename, character, actor, episode, season etc..." autocomplete="off">
                            </div>
                            <span id="clear-search" class="clear-search-button">&times;</span>
                            <div id="suggestions-container"></div>
                        </form>
                    </div>

                    <div id="download-indicator">
                        <div class="progress-circle"></div>
                        <div class="cancel-icon">&times;</div>
                    </div>
                </header>

                <div id="photo-gallery"
                     data-gallery-json="gallery-data.json"
                     data-gallery-id="the-witcher">
                    <div id="gallery-blur-layer" aria-hidden="true"></div>
                    <div id="marquee"></div>
                    <div id="marquee-gutter-highlight" aria-hidden="true"></div>
                </div>

                <footer id="footer">
                    <p class="copyright">&copy; The Witcher, 2019 Netflix. All Rights Reserved.</p>
                </footer>
            </div>
        </div>

        <div id="bg"></div>

        <script src="../shared/js/jquery.min.js"></script>
        <script src="../shared/js/browser.min.js"></script>
        <script src="../shared/js/breakpoints.min.js"></script>
        <script src="../shared/js/util.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

        <script type="application/json" id="gallery-episode-titles">{"1":{"1":"The End's Beginning","2":"Four Marks","3":"Betrayer Moon","4":"Of Banquets, Bastards and Burials","5":"Bottled Appetites","6":"Rare Species","7":"Before a Fall","8":"Much More"},"2":{"1":"A Grain of Truth","2":"Kaer Morhen","3":"What Is Lost","4":"Redanian Intelligence","5":"Turn Your Back","6":"Dear Friend...","7":"Voleth Meir","8":"Family"},"3":{"1":"Shaerrawedd","2":"Unbound","3":"Reunion","4":"The Invitation","5":"The Art of Illusion","6":"Everybody Has a Plan 'til They Get Punched in the Face","7":"Out of the Fire, Into the Frying Pan","8":"The Cost of Chaos"},"4":{"1":"What Doesn't Kill You Makes You Stronger","2":"Dream of a Wish Fulfilled","3":"Trial by Ordeal","4":"A Sermon of Survival","5":"The Joy of Cooking","6":"Twilight of the Wolf","7":"What I Love I Do Not Carry","8":"Baptism of Fire"}}</script>
        <script src="../shared/js/gallery.js?v=20261023-9"></script>
        <script src="../shared/js/gallery-loader.js?v=20261023-1"></script>

        <div id="image-modal" class="modal-overlay">
            <span class="modal-close">&times;</span>
            <span class="modal-prev">&#10094;</span>
            <span class="modal-next">&#10095;</span>
            <div class="modal-content">
                <div class="modal-image-container">
                    <img id="modal-img" src="" alt="Enlarged image">
                </div>
                <div class="modal-info-panel">
                    <div class="info-content">
                        <h3 id="modal-filename"></h3>
                        <div id="modal-metadata">
                        </div>
                    </div>
                    <a id="modal-download-btn" class="button download-btn" download><i class="fas fa-download"></i> Download</a>
                </div>
            </div>
        </div>

        <div id="custom-context-menu" class="context-menu">
            <ul>
                <li id="context-menu-open">Open</li>
                <li id="context-menu-open-tab">Open Image in New Tab</li>
                <li class="separator"></li>
                <li id="context-menu-save">Save Image to "Downloads"</li>
            </ul>
        </div>

        <div id="gallery-context-menu" class="context-menu">
            <ul>
                <li id="gallery-context-add">Add Images</li>
                <li class="separator"></li>
                <li id="gallery-context-group" class="context-menu-parent">Group By</li>
                <li id="gallery-context-sort">Sort By</li>
                <li id="gallery-context-view">Show View Options</li>
            </ul>
        </div>

        <div id="gallery-group-by-menu" class="context-menu context-submenu">
            <ul></ul>
        </div>

        <div id="view-options-panel" class="view-options-panel" role="dialog" aria-labelledby="view-options-title" hidden>
            <div class="view-options-title-bar">
                <button type="button" class="view-options-close" aria-label="Close"></button>
                <h2 id="view-options-title" class="view-options-title">The Witcher</h2>
            </div>
            <div class="view-options-row">
                <label for="view-options-group-by">Group By:</label>
                <select id="view-options-group-by"></select>
            </div>
            <div class="view-options-separator"></div>
            <div class="view-options-slider">
                <label for="view-options-corner-radius">Corner radius:</label>
                <output id="view-options-corner-radius-value" for="view-options-corner-radius">6%</output>
                <input type="range" id="view-options-corner-radius" min="0" max="50" step="1" value="6" list="view-options-corner-radius-ticks">
                <datalist id="view-options-corner-radius-ticks"><option value="0"></option><option value="10"></option><option value="20"></option><option value="30"></option><option value="40"></option><option value="50"></option></datalist>
            </div>
            <div class="view-options-separator"></div>
            <label class="view-options-check"><input type="checkbox" id="view-options-show-item-info" checked>Show item info</label>
        </div>

        <div id="custom-scrollbar-track">
            <div id="custom-scrollbar-thumb"></div>
        </div>
        
        <input type="file" id="image-upload-input" style="display: none;" accept="image/*" multiple />
        
    </body>
</html>
